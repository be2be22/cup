version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - WS_PATH=${WS_PATH:-/ws}
      - XRAY_PORT=${XRAY_PORT:-10000}
    depends_on:
      - xray
      - panel
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  xray:
    image: teddysun/xray:latest
    container_name: xray
    volumes:
      - xray_data:/etc/xray
    restart: unless-stopped
    # کانفیگ اولیه توسط پنل نوشته و بازنویسی می‌شود
    command: ["xray", "run", "-config", "/etc/xray/config.json"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  panel:
    build: ./panel
    container_name: panel
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-changeme}
      - SECRET_KEY=${SECRET_KEY:-please-change-this-secret-key}
      - WS_PATH=${WS_PATH:-/ws}
      - XRAY_PORT=${XRAY_PORT:-10000}
      - PUBLIC_PORT=${PUBLIC_PORT:-443}
      - PUBLIC_TLS=${PUBLIC_TLS:-true}
      - XRAY_CONTAINER_NAME=xray
    volumes:
      - xray_data:/etc/xray
      - panel_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

volumes:
  xray_data:
  panel_data:
